    tagline: 'Opiniones de clientes'
    quote: 'Convirtieron un encargo difuso en un sitio que nuestros clientes usan de verdad. Planes claros, estimaciones honestas y ninguna sorpresa en el lanzamiento. Las ventas llegaron después.'
    name: 'Maya Okafor'
    role: 'Fundadora, Example Jewellers'
  cta:
    text: 'Diseñamos marcas y construimos sitios a medida: tiendas, portfolios, publicaciones, productos y documentación. Cada cliente trabaja con quienes hacen el trabajo, de la estrategia y el diseño al código y el cuidado tras el lanzamiento.'
