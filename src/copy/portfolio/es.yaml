about:
  pageTitle: 'Estudio — Atelier North'
  title: 'Un estudio pequeño, a propósito'
  subtitle: 'Cuatro personas, una sala y la costumbre de terminar lo que empezamos.'
  imageAlt: 'Un escritorio luminoso con un portátil, una silla blanca y lápices en un vaso'
  body: |
    Fundamos Atelier North para trabajar en menos proyectos y hacerlos bien. Cada cliente trabaja con las personas que diseñan y construyen su sitio, desde la primera llamada hasta el lanzamiento.

    Nos importan las **páginas rápidas**, la **tipografía legible** y las **interfaces accesibles**, y escribimos el código que entregamos como si tuviéramos que mantenerlo nosotros.
