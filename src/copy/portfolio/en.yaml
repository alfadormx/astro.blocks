about:
  pageTitle: 'About — Atelier North'
  title: 'A small studio, on purpose'
  subtitle: 'Four people, one room, and a habit of finishing what we start.'
  imageAlt: 'A bright studio desk with a laptop, a white chair and pencils in a cup'
  body: |
    We started Atelier North to work on fewer projects and do them properly. Every client works with the people who design and build their site, from the first call to launch day.

    We care about **fast pages**, **readable type** and **accessible interfaces**, and we write the code we hand over as if we had to maintain it ourselves.
