home:
  pageTitle: 'Olmo Café & Panadería — café y pan en Malasaña, Madrid'
  description: 'Una cafetería y panadería de barrio en Malasaña, Madrid: café de especialidad, pan de masa madre, bollería y desayunos, todos los días menos el domingo.'
  hero:
    tagline: 'Malasaña, Madrid'
    title: 'Pan recién hecho y buen café desde 1998'
    subtitle: 'Una panadería de barrio que abre temprano, lo hornea todo en casa y conoce a casi todos sus clientes por su nombre.'
    primary: 'Ver la carta'
    secondary: 'Visítanos'
