        content: 'Granos de origen único tostados en Madrid, en espresso o en filtro.'
        imageAlt: 'Un barista dibujando latte art en una taza blanca'
      bread:
        title: 'Pan de masa madre'
        content: 'Hogazas de fermentación lenta con nuestra propia masa madre, fuera del horno antes de las ocho.'
        imageAlt: 'Una hogaza de masa madre con semillas, en parte cortada, sobre una tabla'
      pastries:
        title: 'Bollería'
        content: 'Cruasanes de mantequilla, napolitanas y una tarta de temporada que cambia cada semana.'
        imageAlt: 'Un cruasán dorado sobre una tabla de madera'
      breakfast:
        title: 'Desayunos'
        content: 'Tostada con tomate y aceite, huevos, yogur y fruta, hasta el mediodía.'
        imageAlt: 'Tostada de aguacate con brotes en un plato blanco'
  about:
    tagline: 'Nuestra historia'
    title: 'Una panadería de barrio'
    body: |
      Olmo abrió en 1998 como una panadería con dos hornos en la calle del Pez. Los hornos son más nuevos, pero el pan se sigue formando a mano cada noche y sale antes de que despierte la calle.

      En 2012 añadimos la barra de café, porque los vecinos pedían un sitio donde sentarse. Hoy es donde la gente queda antes del trabajo, a la salida del colegio y los sábados por la mañana.
    imageAlt: 'Un panadero formando masa sobre una mesa enharinada'
