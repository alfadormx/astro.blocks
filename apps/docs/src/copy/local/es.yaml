    title: '¿Preparas una celebración?'
    subtitle: 'Catas, tartas de cumpleaños, desayunos de empresa o una tarde privada: mira lo que viene o escríbenos para pedir presupuesto.'
    action: 'Pedir presupuesto'
  faq:
    tagline: 'Conviene saber'
    title: 'Preguntas frecuentes'
    items:
      order:
        question: '¿Puedo encargar pan o tartas con antelación?'
        answer: 'Sí. Encarga el pan antes de las 18:00 del día anterior y las tartas de celebración con al menos 48 horas, en la tienda, por teléfono o con el formulario de abajo.'
      gluten:
        question: '¿Tenéis opciones sin gluten?'
        answer: 'Horneamos un pan de trigo sarraceno los martes y viernes, pero todo sale de la misma cocina, así que no podemos garantizar que no tenga trazas.'
      laptop:
        question: '¿Puedo trabajar en la cafetería?'
        answer: 'Entre semana, sí: hay wifi y una mesa larga junto a la ventana. Los fines de semana reservamos las mesas para desayunar.'
      parking:
        question: '¿Dónde puedo aparcar cerca?'
        answer: 'Malasaña es casi todo peatonal. El aparcamiento más cercano está en la calle de San Bernardo, a cinco minutos andando; el metro de Noviciado está aún más cerca.'
