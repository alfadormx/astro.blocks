      order:
        question: 'Can I order bread or cakes in advance?'
        answer: 'Yes. Order loaves by 18:00 the day before, and celebration cakes at least 48 hours ahead, in the shop, by phone or with the form below.'
      gluten:
        question: 'Do you have gluten-free options?'
        answer: 'We bake a buckwheat loaf on Tuesdays and Fridays, but everything comes out of the same kitchen, so we cannot promise it is free of traces.'
      laptop:
        question: 'Can I work from the café?'
        answer: 'On weekdays, yes: there is wifi and a long table by the window. At weekends we keep the tables for breakfast.'
      parking:
        question: 'Where can I park nearby?'
        answer: 'Malasaña is mostly pedestrian. The closest car park is on Calle de San Bernardo, a five-minute walk away; the Noviciado metro stop is closer still.'
