  about:
    tagline: 'Since 1998'
    title: 'Our story'
    body: |
      Olmo opened in 1998 as a two-oven bakery on Calle del Pez. The ovens are newer now, but the bread is still shaped by hand each night and baked before the street wakes up.

      We added the coffee bar in 2012, when the neighbours kept asking for somewhere to sit. Today it is the place people meet before work, after school and on slow Saturday mornings.
    imageAlt: 'A baker shaping dough on a floured table'
