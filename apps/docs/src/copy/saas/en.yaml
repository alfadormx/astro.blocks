faq:
  title: 'Questions'
  items:
    trial:
      question: 'How does the free trial work?'
      answer: 'You get every **Team** feature for 14 days. No credit card is needed, and you can stay on Starter afterwards.'
    install:
      question: 'How do I send events?'
      answer: 'Add our script tag or use one of the SDKs. Most teams see their first events within *five minutes*.'
    data:
      question: 'Where is my data stored?'
      answer: 'In the EU by default. Scale plans can choose a region.'
    cancel:
      question: 'Can I cancel any time?'
      answer: 'Yes. Cancel from your settings and you keep access until the end of the billing period.'
    migrate:
      question: 'Can I import data from another tool?'
      answer: 'Yes. Upload a CSV export, or ask us and we will help you move it.'
