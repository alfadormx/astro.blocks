faq:
  title: 'Preguntas'
  items:
    trial:
      question: '¿Cómo funciona la prueba gratuita?'
      answer: 'Tienes todas las funciones de **Team** durante 14 días. No necesitas tarjeta y después puedes quedarte en Starter.'
    install:
      question: '¿Cómo envío eventos?'
      answer: 'Añade nuestra etiqueta de script o usa uno de los SDK. La mayoría de equipos ve sus primeros eventos en *cinco minutos*.'
    data:
      question: '¿Dónde se guardan mis datos?'
      answer: 'En la UE por defecto. Los planes Scale pueden elegir región.'
    cancel:
      question: '¿Puedo cancelar cuando quiera?'
      answer: 'Sí. Cancela desde los ajustes y conservas el acceso hasta el final del periodo de facturación.'
    migrate:
      question: '¿Puedo importar datos de otra herramienta?'
      answer: 'Sí. Sube una exportación CSV o pídenos ayuda para moverlos.'
