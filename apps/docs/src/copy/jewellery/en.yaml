  craft:
    tagline: 'Craftsmanship'
    title: 'Every stone set by hand'
    body: |
      Each piece starts as a drawing on the bench and ends under a setter's loupe. We cast in recycled gold, file and polish every band, and set each stone by hand, one claw at a time.

      Nothing leaves the workshop until it has been worn for a day by one of us.
    imageAlt: 'A goldsmith filing a ring at the workbench'
