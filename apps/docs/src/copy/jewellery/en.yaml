about:
  pageTitle: 'About · Atelier Halden'
  title: 'A workshop, not a factory'
  subtitle: 'Nine people, one long bench and sixty years of rings.'
  body: |
    Atelier Halden began in 1962 as a repair counter in Antwerp's diamond quarter. Today the same workshop designs, casts, sets and polishes every piece we sell.

    We work in recycled gold, buy stones we can trace, and keep the bench in the shop, so you can watch your ring being made.
  imageAlt: 'The workshop bench with tools and trays of stones'
  history:
    tagline: 'Since 1962'
    title: 'Our story'
    items:
      founded:
        title: '1962 · A repair counter'
        content: 'Jan Halden opens a small repair shop near the diamond district.'
      diamond:
        title: '1978 · The first setter'
        content: 'We start setting stones in house instead of sending them out.'
      second:
        title: '1996 · A second generation'
        content: 'Els Halden takes over the bench and draws the first Classic.'
      configurator:
        title: '2024 · Design online'
        content: 'Customers can design their own ring and share it with a link.'
  stats:
    tagline: 'In numbers'
    title: 'Small, on purpose'
    items:
