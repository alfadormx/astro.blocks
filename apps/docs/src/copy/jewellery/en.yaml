        title: 'How do I find my ring size?'
        content: 'Come by and we measure it in a minute, or order a free sizer and we post it to you.'
      resizing:
        title: 'Can you resize a ring?'
        content: 'Yes, ours for free in the first year and other rings for a small fee, usually within a week.'
      care:
        title: 'How should I clean my jewellery?'
        content: 'Warm water, a drop of soap and a soft brush. Bring it in once a year and we polish it for free.'
      engraving:
        title: 'What can you engrave?'
        content: 'Up to twenty characters inside the band: names, dates, initials or a short word.'
