  craft:
    tagline: 'Oficio'
    title: 'Cada piedra, engastada a mano'
    body: |
      Cada pieza empieza como un dibujo en el banco y termina bajo la lupa del engastador. Fundimos oro reciclado, limamos y pulimos cada aro y engastamos cada piedra a mano, garra a garra.

      Nada sale del taller hasta que uno de nosotros lo ha llevado puesto un día entero.
    imageAlt: 'Un orfebre limando un anillo en el banco de trabajo'
    action: 'Conoce el taller'
