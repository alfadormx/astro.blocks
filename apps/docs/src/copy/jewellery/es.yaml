about:
  pageTitle: 'Nosotros · Atelier Halden'
  title: 'Un taller, no una fábrica'
  subtitle: 'Nueve personas, un banco largo y sesenta años de anillos.'
  body: |
    Atelier Halden empezó en 1962 como un mostrador de reparaciones en el barrio de los diamantes de Amberes. Hoy el mismo taller diseña, funde, engasta y pule cada pieza que vendemos.

    Trabajamos con oro reciclado, compramos piedras cuyo origen podemos rastrear y tenemos el banco en la tienda, para que veas cómo se hace tu anillo.
  imageAlt: 'El banco del taller con herramientas y bandejas de piedras'
  history:
    tagline: 'Desde 1962'
    title: 'Nuestra historia'
    items:
      founded:
        title: '1962 · Un mostrador de reparaciones'
        content: 'Jan Halden abre un pequeño taller de reparaciones junto al barrio de los diamantes.'
      diamond:
        title: '1978 · El primer engastador'
        content: 'Empezamos a engastar las piedras en casa en lugar de enviarlas fuera.'
      second:
        title: '1996 · Una segunda generación'
        content: 'Els Halden toma el banco y dibuja el primer Clásico.'
      configurator:
        title: '2024 · Diseño en línea'
        content: 'Los clientes pueden diseñar su propio anillo y compartirlo con un enlace.'
  stats:
    tagline: 'En cifras'
    title: 'Pequeños, a propósito'
    items:
