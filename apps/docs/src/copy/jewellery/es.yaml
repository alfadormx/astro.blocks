  faq:
    tagline: 'Preguntas'
    title: 'Antes de tu visita'
    items:
      sizing:
        title: '¿Cómo sé mi talla de anillo?'
        content: 'Pásate y la medimos en un minuto, o pide un medidor gratuito y te lo enviamos por correo.'
      resizing:
        title: '¿Podéis ajustar un anillo?'
        content: 'Sí: los nuestros, gratis el primer año, y otros anillos por un pequeño precio, normalmente en una semana.'
      care:
        title: '¿Cómo limpio mis joyas?'
        content: 'Agua templada, una gota de jabón y un cepillo suave. Tráelas una vez al año y las pulimos gratis.'
      engraving:
        title: '¿Qué podéis grabar?'
        content: 'Hasta veinte caracteres dentro del aro: nombres, fechas, iniciales o una palabra corta.'
