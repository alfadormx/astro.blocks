site:
  name: 'Fixture'
  site: 'https://fixture.example'
  base: '/'
  trailingSlash: false

i18n:
  default: 'en'
  languages:
    - code: 'en'
      locale: 'en-US'
      basePath: '/'
      direction: 'ltr'
      label: 'English'
    - code: 'es'
      locale: 'es-ES'
      basePath: '/es'
      direction: 'ltr'
      label: 'Español'

metadata:
  title:
    default: 'Fixture'
    template: '%s | Fixture'
  description: 'Container test fixture.'
  author: 'Fixture Author'
  icons:
    favicon: '/favicon.ico'
    apple: '/apple-touch-icon.png'
    icon32: '/favicon-32x32.png'
    icon16: '/favicon-16x16.png'
    maskIcon: '/safari-pinned-tab.svg'
    maskIconColor: '#1e66f5'
  twitter:
    cardType: 'summary_large_image'
    image: '/twitter-image.png'
